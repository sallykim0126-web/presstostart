        transform-box: fill-box;
        transform-origin: center;
      }
      .click-wave {
        animation: click-wave 1.45s ease-out infinite;
      }
      .click-dot {
        animation: click-dot 1.45s ease-in-out infinite;
      }
      @keyframes click-wave {
        0%, 12% { transform: scale(0.65); opacity: 0; }
        19% { opacity: 1; }
        52%, 100% { transform: scale(1.85); opacity: 0; }
      }
      @keyframes click-dot {
        0%, 28%, 100% { transform: scale(1); }
        12% { transform: scale(0.72); }
        21% { transform: scale(1.08); }
      }
      @media (prefers-reduced-motion: reduce) {
        .click-wave, .click-dot { animation: none; }
      }
