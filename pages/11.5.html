
<!DOCTYPE html>
<html lang="ko">
<head>
<script>
  if (new URLSearchParams(location.search).get("blink") === "stack") {
    document.documentElement.classList.add("stack-blink-entry");
  }
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>11.5</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #aaa;
    }

    body {
      display: grid;
      place-items: center;
    }

    .scene {
  --art-width: max(100vw, calc(100vh * 16 / 9));
  --art-height: max(100vh, calc(100vw * 9 / 16));
  --polaroid-left: 30.65%;
  /* Keep the photo in view when a narrow window crops the desktop art. */
  --art-left: max(calc((100vw - var(--art-width)) / 2), calc(8px - var(--art-width) * 0.3065));

  position: fixed;
  inset: 0;

  width: 100vw;
  height: 100vh;

  overflow: hidden;
}

/* 공통 */
.scene-image {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;
  object-position: var(--art-left) center;

  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}

/* =========================
   배경
   ========================= */

.base-image {
  z-index: 1;
}

/* =========================
   위에 얹히는 31-0.5
   ========================= */

.detail {
  z-index: 2;

  opacity: 0;
  visibility: hidden;

  /* 살짝 크게 시작 */
  transform: scale(1.02);

  transform-origin: center center;

  transition:
    opacity 900ms ease,
    transform 900ms ease,
    visibility 900ms;
}

.scene.is-open .detail {
  opacity: 1;
  visibility: visible;

  transform: scale(1);
}

    /* =====================================
       ★ 스크롤 후 나타나는 31-2.svg
       ===================================== */

    .next-scene {
  z-index: 3;
  display: none;
}

.scene.show-next .next-scene {
  display: block;
}

    .scene.show-next .next-scene {
      opacity: 1;
      visibility: visible;
    }

    /* =====================================
       폴라로이드 클릭 영역
       ===================================== */

    .polaroid-layer {
      position: absolute;
      left: var(--art-left);
      top: 50%;
      width: var(--art-width);
      height: var(--art-height);
      transform: translateY(-50%);
      pointer-events: none;
      z-index: 5;
    }

    .polaroid {
      position: absolute;
      left: var(--polaroid-left);
      top: 38.75%;
      width: 6.6%;
      height: 16%;
      padding: 0;
      border: 0;
      background: transparent;
      pointer-events: auto;
      cursor: pointer;
    }

    .polaroid img {
      position: absolute;
      left: 50%;
      top: 40%;
      width: 175%;
      height: auto;
      /* Anchor the blue dot just above the center of the Polaroid. */
      transform: translate(-49.4%, -41.75%);
      pointer-events: none;
    }

    .polaroid:focus-visible {
      outline: 3px solid white;
      outline-offset: 4px;
    }

    .scene.is-open .polaroid {
      visibility: hidden;
    }

    .error {
      position: absolute;
      left: 20%;
      right: 20%;
      bottom: 4%;
      padding: 12px;
      background: white;
      color: #222;
      font: 14px/1.5 sans-serif;
      z-index: 30;
    }

    .error[hidden] {
      display: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .detail,
      .next-scene {
        transition: none;
      }
    }

    /* =====================================
   눈 깜박임 레이어
   ===================================== */

#blink {
  position: fixed;
  inset: -2px;

  width: calc(100% + 4px);
  height: calc(100% + 4px);

  z-index: 9999;

  pointer-events: none;

  visibility: hidden;
}

.stack-blink-entry #blink {
  visibility: visible;
  background: #000;
}

#blink svg {
  width: 100%;
  height: 100%;

  display: block;
}
  </style>
<script src="../assets/project-sounds.js?v=office-loop"></script>
<script src="../assets/project-scroll-hint.js?v=2"></script>
<script src="../assets/project-blink.js"></script>
</head>

<body data-mute-clicks>

  <main class="scene" id="scene">

  <!-- 배경 -->
  <img
    class="scene-image base-image"
    id="base"
    src="../assets/31-hd.webp"
    alt=""
    draggable="false"
  >

  <!-- 위에 얹히는 이미지 -->
  <img
    class="scene-image detail"
    id="detail"
    src="../assets/31-0.5.webp"
    alt=""
    draggable="false"
  >

  <!-- 눈 깜박임 후 나오는 장면 -->
<img
  class="scene-image next-scene"
  id="nextScene"
  src="../assets/31-2.svg"
  alt=""
  draggable="false"
>

  <!-- 클릭 영역 -->
  <div class="polaroid-layer">
    <button
      class="polaroid"
      id="polaroid"
      aria-label="폴라로이드 사진 확대"
    ><img src="../assets/41.svg" alt=""></button>
  </div>

</main>

<!-- ★ 여기부터 추가 -->
<div id="blink" aria-hidden="true">

</div>
<!-- ★ 여기까지 -->

  <script>

    const scene =
      document.getElementById("scene");

    const polaroid =
      document.getElementById("polaroid");

    const detail =
      document.getElementById("detail");

      const nextScene =
  document.getElementById("nextScene");


const blink =
  document.getElementById("blink");





    /* 화면 단계
       0 = 기본 화면
       1 = 폴라로이드 확대
       2 = 31-2.svg
    */
   let currentStage = 0;
let blinking = false;
let officeSound;
let officeVisible = window.parent === window;

window.projectSounds?.preload("officeAmbience");

async function startOfficeSound() {
  if (!officeVisible || currentStage !== 0 || officeSound) return;
  const playback = new AbortController();
  officeSound = playback;
  const started = await window.projectSounds?.play("officeAmbience", { signal: playback.signal });
  if (!started && officeSound === playback) officeSound = undefined;
}

function stopOfficeSound() {
  officeSound?.abort();
  officeSound = undefined;
}

if (officeVisible) {
  window.addEventListener("load", startOfficeSound, { once: true });
} else {
  function showOffice(event) {
    if (event.source !== window.parent || event.origin !== window.location.origin ||
        event.data?.type !== "OFFICE_SCENE_VISIBLE") return;
    window.removeEventListener("message", showOffice);
    officeVisible = true;
    startOfficeSound();
  }
  window.addEventListener("message", showOffice);
}
window.addEventListener("pointerup", startOfficeSound);
window.addEventListener("keydown", startOfficeSound);
window.addEventListener("pagehide", stopOfficeSound);
    

    /* =====================================
       폴라로이드 확대
       ===================================== */

    function setOpen(open) {

      scene.classList.toggle(
        "is-open",
        open
      );

      polaroid.setAttribute(
        "aria-expanded",
        String(open)
      );

      detail.setAttribute(
        "aria-hidden",
        String(!open)
      );

      currentStage = open ? 1 : 0;
      if (open) stopOfficeSound();
      else startOfficeSound();
    }


polaroid.addEventListener("click", () => {

  if (currentStage !== 0) return;

  window.projectSounds?.play("polaroidPeel");
  setOpen(true);

});


/* =====================================
   눈 깜박임 설정
   ===================================== */

const CLOSE_MS = 850;
const HOLD_MS = 200;
const OPEN_MS = 950;


function clamp(n) {
  return Math.max(0, Math.min(1, n));
}


function ease(t) {
  t = clamp(t);
  return t * t * (3 - 2 * t);
}


/* =====================================
   눈꺼풀 모양
   ===================================== */

function drawEye(p) {
  window.drawPrestoEyelids(document.getElementById("blink"), p);
}


/* =====================================
   눈꺼풀 애니메이션
   ===================================== */

function tween(from, to, duration) {
  if (from === 0 && to === 1) window.projectSounds?.play('blink');

  return new Promise(resolve => {

    const start =
      performance.now();

    function tick(now) {

      const t =
        Math.min(
          1,
          (now - start) /
          duration
        );

      drawEye(
        from +
        (to - from) *
        ease(t)
      );

      if (t < 1) {

        requestAnimationFrame(
          tick
        );

      } else {

        resolve();

      }
    }

    requestAnimationFrame(
      tick
    );

  });
}


function pause(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );
}


/* =====================================
   31-0.5 → blink → 31-2
   ===================================== */

let whyScrollReadyAt = Infinity;

async function showNextScene() {

  if (
    currentStage !== 1 ||
    blinking
  ) {
    return;
  }


  blinking = true;

  blink.style.visibility =
    "visible";


  /* 눈 감기 */
  await tween(
    0,
    1,
    CLOSE_MS
  );


  /* 완전히 감긴 순간 이미지 교체 */
  scene.classList.add(
    "show-next"
  );

  currentStage = 2;


  await pause(
    HOLD_MS
  );


  /* 눈 뜨기 */
  await tween(
    1,
    0,
    OPEN_MS
  );


  blink.style.visibility = "hidden";
  blink.style.backgroundColor = "transparent";
  blinking = false;

  whyScrollReadyAt = performance.now() + 350;
}

/* =====================================
   31-2 → blink → 12_leaderboard
   ===================================== */

/* =====================================
   31-2 → 눈 깜박임 → 12_leaderboard
   ===================================== */

async function goToLeaderboard() {
  if (currentStage !== 2 || blinking || performance.now() < whyScrollReadyAt) return;
  blinking = true;

  if (window.parent !== window) {
    window.parent.postMessage({ type: "NEXT_PAGE" }, window.location.origin);
    return;
  }

  blink.style.visibility = "visible";
  await tween(0, 1, CLOSE_MS);
  await pause(HOLD_MS);
  window.location.href = "12_leaderboard.html";
}

/* =====================================
   아래로 스크롤
   ===================================== */

function advanceOnScroll() {
  if (blinking) return;
  if (currentStage === 1) showNextScene();
  if (currentStage === 2) goToLeaderboard();
}

window.addEventListener("wheel", event => {
  if (event.ctrlKey || event.deltaY <= 0) return;
  event.preventDefault();
  advanceOnScroll();
}, { passive: false });

let touchStartY;
window.addEventListener("touchstart", event => {
  touchStartY = event.touches.length === 1 ? event.touches[0].clientY : undefined;
}, { passive: true });
window.addEventListener("touchend", event => {
  if (touchStartY - event.changedTouches[0].clientY >= 40) advanceOnScroll();
  touchStartY = undefined;
}, { passive: true });
window.addEventListener("keydown", event => {
  if (event.repeat || document.activeElement?.matches("button") ||
      !["ArrowDown", "PageDown", " "].includes(event.key)) return;
  event.preventDefault();
  advanceOnScroll();
});

    /* =====================================
       ESC 누르면 이전 화면
       ===================================== */

    document.addEventListener("keydown", (event) => {

      if (event.key !== "Escape" || currentStage !== 1 || blinking) return;
      setOpen(false);
      polaroid.focus();

    });

    async function openFromStack() {
      const page = document.documentElement;
      if (!page.classList.contains("stack-blink-entry")) return;

      blinking = true;
      await document.getElementById("base").decode().catch(() => {});
      blink.style.visibility = "visible";
      drawEye(1);
      page.classList.remove("stack-blink-entry");
      try {
        await tween(1, 0, 550);
      } finally {
        blink.style.visibility = "hidden";
        blink.style.backgroundColor = "transparent";
        blinking = false;
      }
    }

    openFromStack();

  
window.installProjectScrollHint(() => !blinking && (currentStage === 1 || performance.now() >= whyScrollReadyAt));
</script>

</body>
</html>
