      let typingSound;
      function stopTypingSound() {
        typingSound?.abort();
        typingSound = undefined;
      }

      window.addEventListener('pagehide', stopTypingSound);

      function revealTypedText(element, message, count) {
        if (count === 1) {
          stopTypingSound();
          typingSound = new AbortController();
          window.projectSounds?.play('gritTyping', { signal: typingSound.signal });
        }
        element.textContent = message.slice(0, count);
        if (count === message.length) stopTypingSound();
      }


      // ======================================
      // 2. 상단 설정 적용
      // ======================================

      text.setAttribute("x", SETTINGS.TEXT_X);

        if (text.textContent.length > 0) {

          // 실제 렌더링된 글씨의 오른쪽 끝
          const bounds = text.getBBox();

          cursorX =
            bounds.x +
            bounds.width +
            SETTINGS.CARET_GAP;

        }

        const cursorTop =
          SETTINGS.TEXT_Y -
          SETTINGS.FONT_SIZE * 0.85;

        const cursorBottom =
          SETTINGS.TEXT_Y +
          SETTINGS.FONT_SIZE * 0.1;

        caret.setAttribute("x1", cursorX);
        caret.setAttribute("x2", cursorX);

        caret.setAttribute("y1", cursorTop);
        caret.setAttribute("y2", cursorBottom);

function drawGritMark() {

  const second =
    document.getElementById("second-text");

  const mark =
    document.getElementById("grit-mark");

  // GRIT 글자의 실제 위치 찾기
  const wordIndex =
    second.textContent.lastIndexOf("GRIT");

  if (wordIndex < 0) return;

  const wordPosition =
    second.getStartPositionOfChar(wordIndex);

  const wordWidth =
    second.getSubStringLength(wordIndex, 4);

  const textY =
    Number(second.getAttribute("y"));

  // ======================================
  // ★ 여기서 동그라미 위치와 크기 조절 ★
  // ======================================

  const MARK_X = -90;      // 좌우 위치
  const MARK_Y = -175;     // 상하 위치
  const MARK_WIDTH = 200;   // 글자보다 넓어지는 정도
  const MARK_HEIGHT = 285; // 세로 크기

  mark.setAttribute(
    "x",
    wordPosition.x + MARK_X
  );

  mark.setAttribute(
    "y",
    textY + MARK_Y
  );

  mark.setAttribute(
    "width",
    wordWidth + MARK_WIDTH
  );

  mark.setAttribute(
    "height",
    MARK_HEIGHT
  );

  // 원본 SVG를 한 번에 표시
  mark.style.transition = "opacity 0.1s ease"; mark.style.opacity = "1";
}


function waitForLineScroll(element, callback) {

  function check() {
    const rect = overlay.getBoundingClientRect();

    const y = Number(element.getAttribute("y"));

    const screenY =
      rect.top + (y / 3438.47) * rect.height;

    // 해당 문장이 화면 높이 55%까지 올라오면 시작
    if (
      window.scrollY > 5 &&
      screenY <= window.innerHeight * 0.55
    ) {
      window.removeEventListener("scroll", check);
      callback();
    }
  }

  window.addEventListener("scroll", check, {
    passive: true
  });

  check();
}

      // ======================================

      function typeNext() {

        if (index >= SETTINGS.MESSAGE.length) {

          // 타이핑 완료 후 커서 숨기기
          setTimeout(() => {

            caret.classList.remove("visible");

      function checkScroll() {

        if (started) return;

        const rect =
          overlay.getBoundingClientRect();

        // 종이 좌표를 실제 화면 좌표로 변환
        const textScreenY =
          rect.top +
          (SETTINGS.TEXT_Y / 3438.47) *
          rect.height;

        // 실제로 스크롤했고,
        // 글씨가 지정된 높이에 도달했을 때
        if (
          window.scrollY > 5 &&
          textScreenY <=
            window.innerHeight * SETTINGS.TYPE_START
        ) {

          started = true;

          updateCaret();
          caret.classList.add("visible");

          typeNext();

        }

      }


      // ======================================
      // 7. 스크롤 이벤트
      // ======================================

      window.addEventListener(
        "scroll",
        checkScroll,
        { passive: true }
      );

      window.addEventListener(
        "resize",
        checkScroll
      );

      window.addEventListener(
        "load",
        checkScroll
      );

      checkScroll();

    })();
  </script>
<script>
function trimPaper() {
  const paper = document.getElementById("paper-page");
  const image = document.getElementById("paper-image");
  const overlay = document.getElementById("paper-overlay");
  const lastText = document.getElementById("tenth-text");

  // 마지막 문장 아래로 보여줄 종이 길이
  const BOTTOM_SPACE = 700;

  const fullHeight = image.getBoundingClientRect().height;
  const svgHeight = overlay.viewBox.baseVal.height;
  const lastY = Number(lastText.getAttribute("y"));

  overlay.style.height = fullHeight + "px";
  paper.style.height =
    (lastY + BOTTOM_SPACE) / svgHeight * fullHeight + "px";

  paper.style.overflow = "hidden";
}

window.addEventListener("load", trimPaper);
window.addEventListener("resize", trimPaper);
</script>


<script>
/* ===========================================
   09 → 10 페이지 전환
   마지막 문장 완료 → 2초 잠금 → 스크롤 → 눈 깜박임
=========================================== */

(() => {
  const lastText = document.getElementById("tenth-text");

  const FINAL_MESSAGE = "TRYING HARDER ISN’T JUST A CHOICE";
  const SCROLL_LOCK_MS = 2000;

  // typing → locked → ready → leaving
  let state = "typing";
  let lockedScrollY = 0;
  let touchStartY = 0;

  // 마지막 문장이 모두 출력되었을 때
  function onLastSentenceComplete() {
    if (state !== "typing") return;

    state = "locked";
    lockedScrollY = window.scrollY;

    // 2초 후 스크롤 전환 허용
    setTimeout(() => {
      if (state === "locked") {
        state = "ready";
      }
    }, SCROLL_LOCK_MS);
  }

  // 마지막 문장의 타이핑 완료 감지
  const observer = new MutationObserver(() => {
    if (lastText.textContent === FINAL_MESSAGE) {
      observer.disconnect();
      onLastSentenceComplete();
    }
  });

  observer.observe(lastText, {
    childList: true,
    characterData: true,
    subtree: true
  });

  // 이미 타이핑이 끝난 경우도 처리
  if (lastText.textContent === FINAL_MESSAGE) {
    observer.disconnect();
    onLastSentenceComplete();
  }

  // 10 페이지로 이동
  function goToNextPage() {
    if (state !== "ready") return;

    state = "leaving";

    // index.html의 기존 눈 깜박임 전환 실행
    if (window.parent !== window) {
      window.parent.postMessage(
        { type: "NEXT_PAGE" },
        "*"
      );
    } else {
      // 09 파일을 단독 실행했을 때의 이동
      window.location.href = "10_sequence.html";
    }
  }

  // 마우스 휠 / 트랙패드
  window.addEventListener("wheel", (e) => {

    if (state === "locked") {
      e.preventDefault();
      return;
    }

    if (state === "ready" && e.deltaY > 5) {
      e.preventDefault();
      goToNextPage();
    }

  }, { passive: false, capture: true });

  // 잠금 중 실제 스크롤 위치 고정
  window.addEventListener("scroll", () => {
    if (
      state === "locked" &&
      Math.abs(window.scrollY - lockedScrollY) > 1
    ) {
      window.scrollTo(0, lockedScrollY);
    }
  }, { passive: true });

  // 모바일 터치 시작
  window.addEventListener("touchstart", (e) => {
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  // 잠금 중 및 전환 대기 중 터치 스크롤 방지
  window.addEventListener("touchmove", (e) => {
    if (state === "locked" || state === "ready") {
      e.preventDefault();
    }
  }, { passive: false, capture: true });

  // 손가락을 위로 밀면 다음 페이지
  window.addEventListener("touchend", (e) => {
    if (state !== "ready") return;

    const touchEndY = e.changedTouches[0].clientY;

    if (touchStartY - touchEndY > 40) {
      goToNextPage();
    }
  });

  // 키보드 스크롤 지원
  window.addEventListener("keydown", (e) => {
    const scrollKeys = [
      "ArrowDown", "ArrowUp",
      "PageDown", "PageUp",
      "Home", "End", " "
    ];

    if (!scrollKeys.includes(e.key)) return;

    if (state === "locked") {
      e.preventDefault();
    }

    if (
      state === "ready" &&
      ["ArrowDown", "PageDown", "End", " "].includes(e.key)
    ) {
      e.preventDefault();
      goToNextPage();
    }
  }, { capture: true });


window.installProjectScrollHint(() => state === "ready");
})();
</script>
