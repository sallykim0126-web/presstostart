
<!DOCTYPE html>
<html lang="ko">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>04 — EFFORT EFFICIENCY</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

body {
  display: grid;
  place-items: center;
}

/* 원본 SVG 비율 유지 */
#scene {
  position: relative;
  width: 100vw;
  height: 100dvh;
  overflow: hidden;
  background: #efefef;
  transform: scale(1.03);
  --mouse-art-width: max(100vw, calc(100dvh * 1366 / 768));
  --mouse-art-height: max(100dvh, calc(100vw * 768 / 1366));
}

/* 모든 SVG를 원본 캔버스에 맞춰 겹치기 */
.layer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  pointer-events: none;
}

/* 레이어 순서 */
#bg {
  z-index: 0;
}

/* 클릭 이미지 전환에는 영향 주지 않는 스크롤 효과 */
#leftNormal,
#leftPressed,
#rightNormal,
#rightPressed {
  transition: transform 1.2s cubic-bezier(0.65, 0, 0.35, 1);
}

/* 스크롤 시 네 SVG 레이어를 똑같이 이동 */
#scene.scrollOut #leftNormal,
#scene.scrollOut #leftPressed,
#scene.scrollOut #rightNormal,
#scene.scrollOut #rightPressed {
  transform: translateY(-110%);
}

/* 눌린 이미지 처음에는 숨기기 */
#leftPressed,
#rightPressed {
  opacity: 0;
}

/* 마우스 클릭 영역 */
#leftNormal, #leftPressed, #rightNormal, #rightPressed {
  translate: 0 calc(var(--mouse-art-height) * -0.03);
}

.hotspot {
  position: absolute;
  z-index: 20;

  border: none;
  background: transparent;
  padding: 0;

  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

/* 왼쪽 마우스 */
#leftHit {
  left: 12.5%;
  top: 29%;
  width: 20.5%;
  height: 58%;
}

/* 오른쪽 마우스 */
#rightNormal, #rightPressed {
  translate: calc(var(--mouse-art-width) * 0.03) calc(var(--mouse-art-height) * -0.03);
}

#rightHit {
  left: 68.5%;
  top: 27%;
  width: 22.5%;
  height: 62%;
}

/* 떠오르는 +1 / +7 */
.floatNum {
  position: absolute;
  z-index: 25;

  font-family: 'DIN 2014', sans-serif;
  font-size: clamp(40px, 5vw, 68px);
  font-weight: 700;

  color: #0000FF;
  line-height: 1;
  white-space: nowrap;

  pointer-events: none;

  animation: floatUp 1000ms ease-out forwards;
}

/* 숫자가 위로 올라가면서 사라짐 */
@keyframes floatUp {
  0% {
    opacity: 1;

    transform:
      translate(-50%, 0);
  }

  100% {
    opacity: 0;

    transform:
      translate(
        calc(-50% + var(--drift-x)),
        -65px
      );
  }
}

/* 파란색 위아래 화살표 */
.chevron {
  position: absolute;
  z-index: 8;

  display: flex;
  flex-direction: column;
  align-items: center;

  gap: 1px;
  pointer-events: none;
}

.chevron.top {
  left: 50%;
  top: 2%;
  transform: translateX(-50%);
}

.chevron.bottom {
  left: 50%;
  bottom: 2.3%;
  transform: translateX(-50%);
}

.chevron span {
  display: block;

  width: 18px;
  height: 18px;

  border-right: 4px solid #2d43ff;
  border-bottom: 4px solid #2d43ff;
}

.chevron.top span {
  transform: rotate(225deg);
}

.chevron.bottom span {
  transform: rotate(45deg);
}


/* 스크롤하면 두 마우스가 위로 사라지는 효과 */
#leftNormal,
#leftPressed,
#rightNormal,
#rightPressed {
  transition: transform 1.2s cubic-bezier(0.65, 0, 0.35, 1),
        
}

#scene.scrollOut #leftNormal,
#scene.scrollOut #leftPressed,
#scene.scrollOut #rightNormal,
#scene.scrollOut #rightPressed {
  transform: translateY(-110%);
  opacity: 0;
}

/* 마우스가 사라지는 동안 클릭 방지 */
#scene.scrollOut #mouseControls .hotspot {
  pointer-events: none;
}


/* 클릭 시 SVG 즉시 전환 */
#leftNormal,
#leftPressed,
#rightNormal,
#rightPressed {
  transition-property: transform;
  transition-duration: 1.2s;
  transition-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
}

/* 클릭 이미지의 초기 상태 */
#leftPressed,
#rightPressed {
  opacity: 0;
}


/* 09. LUCK 제거 */
#page-number {
  display: none !important;
}

/* DRAG UP TO THROW 제거 */
#instruction .hint {
  display: none !important;
}

/* DRAG THE DICE UPWARD 제거 */
#status {
  display: none !important;
}


#mouseControls {
  position: absolute;
  left: 50%;
  top: 50%;
  width: var(--mouse-art-width);
  height: var(--mouse-art-height);
  transform: translate(-50%, -50%);
  z-index: 20;
  pointer-events: none;
}

#mouseControls .hotspot { pointer-events: auto; }

.mouseClickHint {
  position: absolute;
  left: 46.6%;
  top: 68%;
  width: 75%;
  transform: translate(-50%, -50%);
  pointer-events: none;
}
#rightHit .mouseClickHint { left: 42.3%; top: 67%; }
</style>
<script src="../assets/project-sounds.js"></script>
<script src="../assets/project-scroll-hint.js"></script>
</head>

<body>

<div id="scene">


<!-- 배경 -->
<img
  id="bg"
  class="layer"
  src="../assets/10-02.png"
  alt=""
>

<!-- 왼쪽 마우스 기본 -->
<img
  id="leftNormal"
  class="layer"
  src="../assets/10-01.png"
  alt=""
>

<!-- 왼쪽 마우스 눌림 -->
<img
  id="leftPressed"
  class="layer"
  src="../assets/10-05.png"
  alt=""
>

<!-- 오른쪽 마우스 기본 -->
<img
  id="rightNormal"
  class="layer"
  src="../assets/10-03.png"
  alt=""
>

<!-- 오른쪽 마우스 눌림 -->
<img
  id="rightPressed"
  class="layer"
  src="../assets/10-04.png"
  alt=""
>


  <!-- 마우스 클릭 영역 -->
  <div id="mouseControls">
  <button
    id="leftHit"
    class="hotspot"
    data-click-sound="leftMouse"
    aria-label="Left mouse"
  ><img class="mouseClickHint" src="../assets/41.svg" alt=""></button>

  <button
    id="rightHit"
    class="hotspot"
    data-click-sound="rightMouse"
    aria-label="Right mouse"
  ><img class="mouseClickHint" src="../assets/41.svg" alt=""></button>
  </div>

</div>

<script>

/* SVG 이미지 */
const leftNormal =
  document.getElementById('leftNormal');

const leftPressed =
  document.getElementById('leftPressed');

const rightNormal =
  document.getElementById('rightNormal');

const rightPressed =
  document.getElementById('rightPressed');

const leftHit =
  document.getElementById('leftHit');

const rightHit =
  document.getElementById('rightHit');

const scene =
  document.getElementById('scene');



function showPressed(which) {
  const pressed = which === 'left'
    ? leftPressed : rightPressed;

  const normal = which === 'left'
    ? leftNormal : rightNormal;

  // 클릭 SVG 표시
  normal.style.opacity = '0';
  pressed.style.opacity = '1';

  clearTimeout(pressed.pressTimer);

  pressed.pressTimer = setTimeout(() => {
    pressed.style.opacity = '0';
    normal.style.opacity = '1';
  }, 80);
}


/* 랜덤 위치에 +1 / +7 생성 */
function spawnFloat(host, label) {

  const hostRect =
    host.getBoundingClientRect();

  const sceneRect =
    scene.getBoundingClientRect();

  const scaleX = sceneRect.width / scene.clientWidth;
  const scaleY = sceneRect.height / scene.clientHeight;
  const centerX = (hostRect.left + hostRect.width / 2 - sceneRect.left) / scaleX;
  const centerY = (hostRect.top + hostRect.height / 2 - sceneRect.top) / scaleY;

  // 마우스 주변 랜덤 위치
  const randomX = (Math.random() - 0.5) * 180;
  const randomY = (Math.random() - 0.5) * 300;

  // 위로 움직이며 살짝 좌우로 흩어짐
  const driftX =
    (Math.random() - 0.5) * 35;

  const num =
    document.createElement('div');

  num.className = 'floatNum';
  num.textContent = label;

  num.style.left = `${centerX + randomX}px`;
  num.style.top = `${centerY + randomY}px`;

  num.style.setProperty(
    '--drift-x',
    `${driftX}px`
  );

  scene.appendChild(num);

  // 애니메이션 종료 후 제거
  num.addEventListener(
    'animationend',
    () => num.remove(),
    { once: true }
  );
}


/* 왼쪽 클릭 → +1 */
leftHit.addEventListener('click', () => {
  leftHit.querySelector(".mouseClickHint").hidden = true;
  scheduleScrollHint();
  showPressed('left');
  spawnFloat(leftHit, '+1');
});


/* 오른쪽 클릭 → +7 */
rightHit.addEventListener('click', () => {
  rightHit.querySelector(".mouseClickHint").hidden = true;
  scheduleScrollHint();
  showPressed('right');
  spawnFloat(rightHit, '+7');
});


/* 스크롤하면 마우스 위로 이동 */

let isScrollingOut = false;

let scrollReadyAt = Infinity;

function scheduleScrollHint() {
  if (scrollReadyAt === Infinity &&
      leftHit.querySelector(".mouseClickHint").hidden &&
      rightHit.querySelector(".mouseClickHint").hidden) {
    scrollReadyAt = performance.now() + 1500;
  }
}

function canScrollOut() {
  return !isScrollingOut && performance.now() >= scrollReadyAt;
}
window.addEventListener('wheel', (e) => {
  if (e.deltaY <= 0 || !canScrollOut()) return;

  isScrollingOut = true;

  // 마우스 두 개가 위로 사라짐
  scene.classList.add('scrollOut');

  // 마우스 이동 애니메이션이 끝나면 눈 깜빡임
  leftNormal.addEventListener('transitionend', (event) => {
    if (event.propertyName !== 'transform') return;

    window.parent.postMessage(
      { type: 'NEXT_PAGE' },
      '*'
    );
  }, { once: true });

}, { passive: true });



window.installProjectScrollHint(canScrollOut);
</script>

</body>
</html>
