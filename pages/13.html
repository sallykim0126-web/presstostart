
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>EFFORT — 13</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

[hidden] {
  display: none !important;
}


/* ==================================
   16:9 비율 고정 화면
================================== */

#stage {
  position: fixed;

  left: 50%;
  top: 50%;

  /* 항상 16:9 유지하면서 화면 전체 채우기 */
  width: max(100vw, 177.7778dvh);
  height: max(56.25vw, 100dvh);

  transform: translate(-50%, -50%);

  overflow: hidden;
  background: #dddddd;
}


/* 모든 장면에 공통 적용 */
.scene {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}


/* 이미지 공통 설정 */
.scene img {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: contain;
  object-position: center center;

  user-select: none;
  pointer-events: none;
  -webkit-user-drag: none;
}


/* ==================================
   새 장면의 이미지 순서
================================== */

/* 가장 아래 */
#base16 {
  z-index: 1;
}

/* 중간 — 36-08 */
#paper08 {
  z-index: 2;
}

/* 가장 위 — 36-17 */
#paper17 {
  z-index: 3;
}

/* ==================================
   눈 깜박임 — 03 참고
================================== */

#blink {
  position: fixed;
  inset: -2px;

  width: calc(100% + 4px);
  height: calc(100% + 4px);

  z-index: 9999;
  pointer-events: none;

  visibility: hidden;
}

#blink svg {
  width: 100%;
  height: 100%;
  display: block;
}


/* ==================================
   13 — 실제 리더보드 데이터
================================== */

/* 전체 이미지와 동일한 1920x1080 좌표계 */
#leaderDataScale {
  position: absolute;
  left: 0;
  top: 0;

  width: 1920px;
  height: 1080px;

  transform-origin: top left;

  z-index: 5;
  pointer-events: none;
}

/* 종이의 기울기에 맞춰 회전 */
#leaderData {
  position: absolute;
  inset: 0;

  transform: rotate(3.4deg);
  transform-origin: 760px 340px;
}

/* 각각의 리더보드 데이터 */
.leaderCell13 {
  position: absolute;

  font-family: "IBM Plex Mono",
               "Courier New",
               monospace;

  font-size: 18px;
  font-weight: 400;
  color: #242424;

  white-space: nowrap;
  transform: translate(-50%, -50%);
}

/* 사용자 본인 강조 */
.leaderCell13.you {
  color: #1717dc;
  font-weight: 700;
}


/* ==================================
   리더보드 종이 슬라이드
================================== */

/* 움직이는 종이 전체 그룹 */
#frontPaperGroup {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  z-index: 3;

  transform: translateX(0);

  transition:
    transform 1100ms cubic-bezier(
      0.22, 1, 0.36, 1
    );

  will-change: transform;
}

/* 앞쪽 리더보드 종이 */
#frontPaperGroup #paper17 {
  z-index: 1;
}

/* 리더보드 숫자 */
#frontPaperGroup #leaderDataScale {
  z-index: 5;
}

/* 종이 클릭 영역 */
#leaderClickHint {
  position: absolute;
  inset: auto;
  left: 60.3%;
  top: 63.8%;
  width: 14%;
  height: auto;
  transform: translate(-50%, -50%);
  z-index: 8;
  pointer-events: none;
}
#frontPaperGroup.moved #leaderClickHint { visibility: hidden; }

#paperClickArea {
  position: absolute;

  /* 종이의 실제 위치 */
  left: 36%;
  top: 15%;

  width: 53%;
  height: 85%;

  background: transparent;
  border: none;
  padding: 0;

  cursor: pointer;
  z-index: 10;

  transform: rotate(2deg);
}

/* 클릭한 후 오른쪽으로 이동 */
#frontPaperGroup.moved {
  transform: translateX(48%);
}

/* 이동한 뒤 재클릭 방지 */
#frontPaperGroup.moved #paperClickArea {
  pointer-events: none;
}


/* ==================================
   34-16 → 34-17 장면
================================== */

#scene34 {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;

  z-index: 50;
  background: #000;
}

#ending16 {
  z-index: 1;
}

#ending17 {
  z-index: 2;
}


#endingScrollHint {
  position: fixed;
  left: 50%;
  --hint-width: max(calc(100vw * 185 / 1366), calc(100dvh * 185 / 768));
  /* Offset the blank space beneath the lettering in the SVG. */
  bottom: calc(1.3dvh - var(--hint-width) * 0.34);
  transform: translateX(-50%);
  width: var(--hint-width);
  aspect-ratio: 150 / 126;
  z-index: 100;
  visibility: hidden;
  pointer-events: none;
}

#endingScrollHint .frame {
  position: absolute;
  inset: 0;
  display: block;
  opacity: 0;
  transition: opacity 130ms ease;
}

#endingScrollHint .frame.active {
  opacity: 1;
  z-index: 2;
}

#endingScrollHint .frame.ghost {
  opacity: 0.35;
  z-index: 1;
}

#endingScrollHint .frame.skip-transition {
  transition: none;
}

#endingScrollHint .frame svg {
  width: 100%;
  height: 100%;
  display: block;
}

body:has(#ending17:not([hidden])) #endingScrollHint:not([hidden]) {
  visibility: visible;
}

#endingScrollHint .frame .cls-2 { stroke: #0000ff; }
#endingScrollHint .frame .cls-3 { fill: #0000ff; }
</style>

<!-- ==================================
     눈 깜박임 SVG
================================== -->

<div id="blink" aria-hidden="true">

  <svg viewBox="0 0 1000 600"
       preserveAspectRatio="none">

    <defs>
      <filter
        id="edgeBlur"
        x="-15%"
        y="-30%"
        width="130%"
        height="160%"
      >
        <feGaussianBlur stdDeviation="17"/>
      </filter>
    </defs>

    <rect
      id="topCover"
      x="-60"
      y="-60"
      width="1120"
      height="60"
      fill="black"
    />

    <rect
      id="bottomCover"
      x="-60"
      y="600"
      width="1120"
      height="60"
      fill="black"
    />

    <path
      id="lidTop"
      fill="black"
      filter="url(#edgeBlur)"
    />

    <path
      id="lidBottom"
      fill="black"
      filter="url(#edgeBlur)"
    />

  </svg>
</div>

<script>
(() => {

/* ==================================
   1. 설정
================================== */

// 첫 번째 이미지가 유지되는 시간
const AUTO_CHANGE_MS = 2300;

// 눈 감고 / 정지 / 뜨는 시간
// 기존 03_blink 코드 기준
const CLOSE_MS = 600;
const HOLD_MS = 180;
const OPEN_MS = 700;

// 이미지 자동 전환 후 스크롤 잠금
const SCROLL_UNLOCK_MS = 300;

/* ==================================
   2. 요소
================================== */

const scene14 =
  document.getElementById("scene14");

const scene15 =
  document.getElementById("scene15");

const scene16 =
  document.getElementById("scene16");

const scene16Images = [
  document.getElementById("base16"),
  document.getElementById("paper08"),
  document.getElementById("paper17")
];

let scene16AssetsReady;
function prepareScene16Assets() {
  if (scene16AssetsReady) return scene16AssetsReady;

  scene16AssetsReady = Promise.all(scene16Images.map(image => {
    if (!image.src) image.src = image.dataset.src;
    return image.decode().catch(error => {
      console.warn('Scene 16 image decode failed:', image.dataset.src, error);
    });
  }));

  return scene16AssetsReady;
}

const blink =
  document.getElementById("blink");

const lidTop =
  document.getElementById("lidTop");

const lidBottom =
  document.getElementById("lidBottom");

const topCover =
  document.getElementById("topCover");

const bottomCover =
  document.getElementById("bottomCover");

// 현재 장면
let scene = 14;

// 전환 중복 방지
let busy = false;

// 스크롤 잠금 해제 시간
let scrollUnlockTime = Infinity;

const clamp = n =>
  Math.max(0, Math.min(1, n));

const ease = t => {
  t = clamp(t);
  return t * t * (3 - 2 * t);
};

const pause = ms =>
  new Promise(resolve => setTimeout(resolve, ms));


/* ==================================
   3. 눈꺼풀 모양
   기존 03_blink 참고
================================== */

function drawEye(p) {

  p = clamp(p);

  const edge = 300 * p;

  const curve =
    190 * Math.sin(Math.PI * p);

  const bottom = 600 - edge;

  const fade =
    Math.min(1, Math.max(0, p / 0.12));

  // 위쪽 눈꺼풀
  lidTop.setAttribute(
    "d",
    `M-100 -100 H1100 V${edge}
     Q500 ${edge + curve} -100 ${edge} Z`
  );

  // 아래쪽 눈꺼풀
  lidBottom.setAttribute(
    "d",
    `M-100 700 H1100 V${bottom}
     Q500 ${bottom - curve} -100 ${bottom} Z`
  );

  for (const el of [
    lidTop,
    lidBottom,
    topCover,
    bottomCover
  ]) {
    el.style.opacity = fade;
  }

  topCover.setAttribute(
    "height",
    String(60 + Math.max(0, edge - 60))
  );

  bottomCover.setAttribute(
    "y",
    String(Math.min(600, bottom + 60))
  );

  bottomCover.setAttribute(
    "height",
    String(
      660 - Math.min(600, bottom + 60)
    )
  );
}

/* ==================================
   4. 눈꺼풀 애니메이션
================================== */

function tween(from, to, duration) {
  if (from === 0 && to === 1) window.projectSounds?.play('blink');

  return new Promise(resolve => {

    const start = performance.now();

    function tick(now) {

      const t = Math.min(
        1,
        (now - start) / duration
      );

      drawEye(
        from + (to - from) * ease(t)
      );

      if (t < 1) {
        requestAnimationFrame(tick);
      } else {
        resolve();
      }
    }

    requestAnimationFrame(tick);
  });
}

/* ==================================
   5. 14 → 15 자동 전환
================================== */

function showScene15() {

  if (scene !== 14) return;

  scene14.hidden = true;
  scene15.hidden = false;

  scene = 15;

  // 다음 장면의 약 4.8MB PNG들은 필요해지기 직전에만 준비한다.
  prepareScene16Assets();

  // 이전 스크롤 관성으로 바로 넘어가는 것 방지

  scene = 16;

  // ④ 눈을 감고 잠깐 유지
  await pause(HOLD_MS);

  // ⑤ 검은 배경을 제거하고 눈 뜨기
  // 이 시점에 눈꺼풀은 여전히 닫혀 있음

  await tween(1, 0, OPEN_MS);

function handleScroll(deltaY) {

  if (deltaY <= 8) return;
  if (busy) return;

  // 33-14 (AT THIS) → 33-15
  if (scene === 14) {
    showScene15();
    return;
  }

  // 33-15 → 눈 깜박임 → 36-16 + 36-08 + 36-17
  if (scene === 15) {

    if (performance.now() < scrollUnlockTime) {
      return;
    }

    goToScene16();
    return;
  }

  // 마지막 장면 → 다음 페이지
  if (scene === 34 && !ending17.hidden) {
    document.getElementById("endingScrollHint").hidden = true;
    goToScene14();
    return;
  }
}

window.addEventListener(
  "wheel",
  event => {

    if (event.deltaY <= 0) return;

    event.preventDefault();

    handleScroll(event.deltaY);
  },
  {
    passive: false
  }
);

/* ==========================================
   13 — LEADERBOARD 데이터 설정
========================================== */

// ★ 숫자 위치와 크기는 여기서 조절
const RANK13 = {

  START_Y: 347,
  GAP: 81,

  RANK_X: 715,
  PLAYER_X: 830,
  CLICK_X: 950,
  STARTING_X: 1085,
  EFFICIENCY_X: 1265,
  EVENT_X: 1415,
  TIME_X: 1520,

  FONT_SIZE: 25
};

const leaderDataScale =
  document.getElementById("leaderDataScale");

const leaderData =
  document.getElementById("leaderData");

/* ==========================================
   화면 크기에 맞춰 함께 확대/축소
========================================== */

function resizeLeaderData() {

  // 숨겨진 scene16 대신 항상 크기가 있는 stage 사용
  const stage = document.getElementById("stage");

  const scale = stage.clientWidth / 1920;

  leaderDataScale.style.transform =
    `scale(${scale})`;
}
window.addEventListener(
  "resize",
  resizeLeaderData
);

/* ==========================================
   숫자 한 개 출력
========================================== */

function addLeaderCell13(value, x, y, isYou = false) {

  const cell = document.createElement("span");

  cell.className =
    "leaderCell13" + (isYou ? " you" : "");

  cell.textContent = String(value ?? "");

  cell.style.left = x + "px";
  cell.style.top = y + "px";
  cell.style.fontSize =
    RANK13.FONT_SIZE + "px";

  leaderData.appendChild(cell);
}

/* ==========================================
   리더보드 데이터 출력
========================================== */

function renderRanks13(data) {

  leaderData.replaceChildren();

  const sorted = [...data].sort(
    (a, b) => Number(a.rank) - Number(b.rank)
  );

  const mine = sorted.find(
    item => item.is_you === true
  );

  let selected;

  // 사용자가 10위 밖이면
  // 상위 8명 + ... + 사용자 표시
  if (mine && Number(mine.rank) > 10) {

    selected = [
      ...sorted.slice(0, 8),
      { gap: true },
      mine
    ];

  } else {

    selected = sorted.slice(0, 10);

  }

  selected.forEach((item, index) => {

    const y =
      RANK13.START_Y +
      index * RANK13.GAP;

    // 생략된 순위
    if (item.gap) {

      addLeaderCell13(
        "...",
        RANK13.PLAYER_X,
        y
      );

      return;
    }

    const isYou = item.is_you === true;

    const playerLabel = isYou
      ? "YOU"
      : "P" + String(item.rank).padStart(2, "0");

    // 순위
    addLeaderCell13(
      item.rank,
      RANK13.RANK_X,
      y,
      isYou
    );

    // 플레이어
    addLeaderCell13(
      playerLabel,
      RANK13.PLAYER_X,
      y,
      isYou
    );

    // 클릭
    addLeaderCell13(
      item.clicks,
      RANK13.CLICK_X,
      y,
      isYou
    );

    // 시작 자원
    addLeaderCell13(
      item.starting,
      RANK13.STARTING_X,
      y,
      isYou
    );

    // 효율성
    addLeaderCell13(
      Number(item.efficiency).toFixed(2),
      RANK13.EFFICIENCY_X,
      y,
      isYou
    );

    // 이벤트
    addLeaderCell13(
      `+${item.positive_events}/-${item.negative_events}`,
      RANK13.EVENT_X,
      y,
      isYou
    );

    // 시간
    addLeaderCell13(
      "60s",
      RANK13.TIME_X,
      y,
      isYou
    );

  });

}

/* ==========================================
   Supabase에서 실제 순위 가져오기
========================================== */

async function loadRanks13() {

  const url =
    "https://vulpizivyyxsfwnbhsnr.supabase.co";

  const key =
    "sb_publishable_E7og2HYdBat7egSfzdUmGg_16175d4P";

  const savedCode =
    sessionStorage.getItem(
      "presto_leaderboard_code"
    ) || "";

  try {

    const response = await fetch(
      url + "/rest/v1/rpc/get_public_leaderboard",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "apikey": key,
          "Authorization": "Bearer " + key
        },

        body: JSON.stringify({
          p_access_code:
            savedCode.trim().toUpperCase() || null
        })
      }
    );

    if (!response.ok) {
      throw new Error(await response.text());
    }

    const data = await response.json();

    if (!Array.isArray(data)) {
      throw new Error("Invalid leaderboard data");
    }

    renderRanks13(data);

  } catch (error) {

    console.error(
      "13 리더보드 로딩 실패:",
      error
    );

  }
}

const frontPaperGroup =

const paperClickArea =

let paperMoved = false;


/* ==========================================
   리더보드 이동 → 34-16 → 34-17
========================================== */

const scene34 =
  document.getElementById("scene34");

const ending17 =
  document.getElementById("ending17");

  const hint = document.getElementById("endingScrollHint");
  const frames = [...hint.querySelectorAll('.frame')];

  // 17 → 18 → 19 → 20 → 17 → 18 → 19 → 20 반복
  const order = [0, 1, 2, 3];
  let step = 0;

  let previousIndex = null;

  function showFrame(index, showAfterimage = true) {
    const isLoopRestart = previousIndex === order.at(-1) && index === order[0];

    frames.forEach((frame, frameIndex) => {
      frame.classList.remove('active', 'ghost');
      const showImmediately = isLoopRestart && frameIndex === index;
      frame.classList.toggle('skip-transition', !showAfterimage || showImmediately);
    });

    if (showAfterimage && previousIndex !== null && previousIndex !== index) {
      frames[previousIndex].classList.add('ghost');
    }

    frames[index].classList.add('active');
    previousIndex = index;
  }

  showFrame(order[0]);

  const FRAME_DELAY = 200;
  const HOLD_FRAME_DELAY = 800;

  function playLoop() {
    if (hint.hidden || ending17.hidden) return;
    step = (step + 1) % order.length;
    const isHoldFrame = order[step] === 2; // 19
    showFrame(order[step], !isHoldFrame);
    setTimeout(playLoop, isHoldFrame ? HOLD_FRAME_DELAY : FRAME_DELAY);
  }

paperClickArea.addEventListener("click", async () => {

  if (scene !== 16) return;
  if (busy || paperMoved) return;

  paperMoved = true;

  await pause(2000);

  scene16.hidden = true;
  scene34.hidden = false;
  scene = 34;

  // ④ 1.5초 유지
  await pause(1500);

  // ⑤ 34-17.svg 등장
  ending17.hidden = false;
  setTimeout(playLoop, FRAME_DELAY);

});



window.installProjectScrollHint(() => !busy && scene === 15 && performance.now() >= scrollUnlockTime, { dark: true });
