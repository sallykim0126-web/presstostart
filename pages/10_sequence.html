/* ================================
   CRT 컴퓨터 종료 효과
================================ */

/* 화면이 접힐 때 뒤에 보이는 검은 화면 */
body.crt-shutdown::before {
  content: "";
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 9998;
  pointer-events: none;
}

/* 글리치 영상과 에러창 전체를 함께 접기 */
#glitchOverlay.crt-shutting {
  transform-origin: center center;
  animation: crtPowerOff 0.85s ease-in forwards;
}

/* 화면이 세로로 찌그러진 뒤 가로로 사라짐 */
@keyframes crtPowerOff {
  0% {
    transform: scale(1, 1);
    filter: brightness(1);
    opacity: 1;
  }

  20% {
    transform: scale(1.01, 1);
    filter: brightness(1.5);
  }

  55% {
    transform: scale(1, 0.015);
    filter: brightness(2.5);
    opacity: 1;
  }

  75% {
    transform: scale(0.85, 0.008);
    filter: brightness(5);
    opacity: 1;
  }

  100% {
    transform: scale(0, 0.008);
    filter: brightness(8);
    opacity: 0;
  }
}

/* 가운데 남는 밝은 수평선 */
body.crt-shutdown::after {
  content: "";
  position: fixed;
  top: 50%;
  left: 50%;
  width: 100%;
  height: 3px;
  z-index: 10003;

  background: #f3f7ff;
  box-shadow:
    0 0 8px 2px rgba(255,255,255,0.8),
    0 0 25px 4px rgba(200,220,255,0.5);

  transform: translate(-50%, -50%) scaleX(1);
  opacity: 0;
  pointer-events: none;

  animation: crtBeam 0.45s 0.43s ease-out forwards;
}

/* 밝은 선이 점으로 줄어들며 사라짐 */
@keyframes crtBeam {
  0% {
    opacity: 0;
    transform: translate(-50%, -50%) scaleX(1);
  }

  15% {
    opacity: 1;
  }

  65% {
    opacity: 1;
    transform: translate(-50%, -50%) scaleX(0.08);
  }

  100% {
    opacity: 0;
    transform: translate(-50%, -50%) scaleX(0);
  }
}

const introArt = document.getElementById("intro-art");
const introArtReady = introArt.decode().catch(() => {});
const introSceneVisible = new Promise(resolve => {
  if (window.parent === window) {
    resolve();
    return;
  }

  function onSceneVisible(event) {
    if (event.source !== window.parent || event.origin !== window.location.origin ||
        event.data?.type !== "SEQUENCE_SCENE_VISIBLE") return;
    window.removeEventListener("message", onSceneVisible);
    resolve();
  }

const introRevealDelay = introSceneVisible.then(() => wait(2500));

let waitingForSequenceScroll = false;
let showGlitchScrollHint = false;
window.installProjectScrollHint(
  () => waitingForSequenceScroll || showGlitchScrollHint,
  { dark: true }
);

function waitForIntroSwipe() {
  waitingForSequenceScroll = true;
  return new Promise(resolve => {

    let touchStartY = 0;
    let triggered = false;

    function startTransition() {
      if (triggered) return;
      triggered = true;
      waitingForSequenceScroll = false;

      // 전환이 시작되면 이벤트 제거
      window.removeEventListener("wheel", onWheel);
      window.removeEventListener("touchstart", onTouchStart);
      window.removeEventListener("touchend", onTouchEnd);
      window.removeEventListener("keydown", onKeyDown);

      resolve();
    }

    // 마우스 휠 / 트랙패드
    function onWheel(e) {
      if (e.deltaY > 10) {
        e.preventDefault();
        startTransition();
      }
    }

    // 모바일 터치 시작
    function onTouchStart(e) {
      touchStartY = e.touches[0].clientY;
    }

    // 손가락을 위로 밀면 다음 화면
    function onTouchEnd(e) {
      const touchEndY = e.changedTouches[0].clientY;

      if (touchStartY - touchEndY > 40) {
        startTransition();
      }
    }

    // 키보드로도 이동 가능
    function onKeyDown(e) {
      if (
        e.key === "ArrowDown" ||
        e.key === "PageDown" ||
        e.key === " "
      ) {
        e.preventDefault();
        startTransition();
      }
    }

    window.addEventListener("wheel", onWheel, {
      passive: false
    });

    window.addEventListener("touchstart", onTouchStart, {
      passive: true
    });

    window.addEventListener("touchend", onTouchEnd, {
      passive: true
    });

    window.addEventListener("keydown", onKeyDown);
  });
}


    
/* 28.webp → TRY HARDER 눈 깜박임 */

const sequenceBlink =
  document.getElementById("sequence-blink");

const sequenceLidTop =
  document.getElementById("sequenceLidTop");

const sequenceLidBottom =
  document.getElementById("sequenceLidBottom");

const sequenceTopCover =
  document.getElementById("sequenceTopCover");

const sequenceBottomCover =
  document.getElementById("sequenceBottomCover");

function drawSequenceEye(p) {
  p = Math.max(0, Math.min(1, p));

  const edge = 300 * p;
  const curve = 190 * Math.sin(Math.PI * p);
  const bottom = 600 - edge;
  const fade = Math.min(1, p / 0.12);

  sequenceLidTop.setAttribute(
    "d",
    `M-100 -100 H1100 V${edge} Q500 ${edge + curve} -100 ${edge} Z`
  );

  sequenceLidBottom.setAttribute(
    "d",
    `M-100 700 H1100 V${bottom} Q500 ${bottom - curve} -100 ${bottom} Z`
  );

  [
    sequenceLidTop,
    sequenceLidBottom,
    sequenceTopCover,
    sequenceBottomCover
  ].forEach(el => {
    el.style.opacity = fade;
  });

  sequenceTopCover.setAttribute(
    "height",
    String(60 + Math.max(0, edge - 60))
  );

  sequenceBottomCover.setAttribute(
    "y",
    String(Math.min(600, bottom + 60))
  );

  sequenceBottomCover.setAttribute(
    "height",
    String(660 - Math.min(600, bottom + 60))
  );

  // 완전히 감겼을 때 화면 전체를 검정으로
  sequenceBlink.style.backgroundColor =
    p >= 0.999 ? "#000" : "transparent";
}

function tweenSequenceEye(from, to, duration) {
  if (from === 0 && to === 1) window.projectSounds?.play('blink');
  return new Promise(resolve => {
    const start = performance.now();

    function tick(now) {
      const t = Math.min(
        1,
        (now - start) / duration
      );

      const eased = t * t * (3 - 2 * t);

      drawSequenceEye(
        from + (to - from) * eased
      );

      if (t < 1) {
        requestAnimationFrame(tick);
      } else {
        resolve();
      }
    }

    requestAnimationFrame(tick);
  });
}

const BLINK_CLOSE_MS = 550;
const BLINK_HOLD_MS = 150;
const BLINK_OPEN_MS = 550;

async function blinkTo(changeScene) {
  sequenceBlink.style.visibility = "visible";
  drawSequenceEye(0);

  await tweenSequenceEye(0, 1, BLINK_CLOSE_MS);

  await wait(BLINK_HOLD_MS);

  // Reveal the next scene and start its cue as the eye opens.
  changeScene();
  await tweenSequenceEye(1, 0, BLINK_OPEN_MS);

  sequenceBlink.style.visibility = "hidden";
  sequenceBlink.style.backgroundColor = "transparent";
}

async function playGlitchVideo() {
  const overlay = document.getElementById("glitchOverlay");
  const video = document.getElementById("glitchVideo");
  const interactions = new AbortController();
  const { signal } = interactions;
  const hideScrollHint = () => { showGlitchScrollHint = false; };

  // 영상 장면이 실제로 시작되기 직전에만 네트워크 요청을 시작한다.
  if (!video.src) {
    video.src = video.dataset.src;
    video.load();
  }

  overlay.classList.add("active");
  video.currentTime = 0;
  showGlitchScrollHint = true;

  window.addEventListener("wheel", event => {
    if (event.deltaY !== 0) hideScrollHint();
  }, { passive: true, signal });
  window.addEventListener("touchmove", hideScrollHint, { passive: true, signal });
  window.addEventListener("keydown", event => {
    if (["ArrowDown", "ArrowUp", "PageDown", "PageUp", " "].includes(event.key)) {
      hideScrollHint();
    }
  }, { signal });

  const finished = await new Promise(resolve => {
    video.addEventListener("timeupdate", () => {
      if (Number.isFinite(video.duration) &&
          video.duration - video.currentTime <= 0.25) {
        resolve(true);
      }
    }, { signal });
    video.addEventListener("ended", () => resolve(true), { once: true, signal });
    video.addEventListener("error", () => resolve(false), { once: true, signal });
    video.play().catch(error => {
      console.error("Video playback failed:", error);
      resolve(false);
    });
  });

  interactions.abort();
  hideScrollHint();

  if (!finished) {
    overlay.classList.remove("active");
    return;
  }

  const shutdown = new Promise(resolve => {
    overlay.addEventListener("animationend", resolve, { once: true });
  });
  document.body.classList.add("crt-shutdown");
  overlay.classList.add("crt-shutting");
  await Promise.race([shutdown, wait(650)]);
  video.pause();
}





    // ==========================================
    // 2. SVG 불러오기
    // ==========================================

    async function startSequence() {

      let source;
      if (location.protocol === "file:") {
        source = document.getElementById("sequence-local-svg").textContent.trim();
      } else {
        const response = await fetch(SVG_PATH);
        if (!response.ok) throw new Error("SVG loading failed: " + SVG_PATH);
        source = await response.text();
      }

      const doc = new DOMParser().parseFromString(
        source,
        "image/svg+xml"
      );

      const svg = doc.documentElement;

      const originalGroup = Array
        .from(svg.children)
        .find(el => el.localName === "g");

      if (!originalGroup) {
        throw new Error("SVG 글자 그룹을 찾지 못했습니다.");
      }

      const paths = Array
        .from(originalGroup.children)
        .filter(el => el.localName === "path");

      // 25-11 원본: 6줄 × 줄당 9개 글자 경로
      if (paths.length !== 54) {
        throw new Error(
          "25-11.svg의 글자 구조가 변경되었습니다."
        );
      }


      // ==========================================
      // 3. 글씨를 줄 단위로 분리
      // ==========================================

      svg.removeChild(originalGroup);

      svg.setAttribute(
        "preserveAspectRatio",
        "xMidYMid meet"
      );

      const track = document.createElementNS(
        NS, "g"
      );

      svg.appendChild(track);

      const rows = [];

      const totalRows = 6 + REPEAT_COUNT;

      for (let i = 0; i < totalRows; i++) {

        const sourceRow = Math.min(i, 5);

        const row = document.createElementNS(
          NS, "g"
        );

        // 처음에는 보이지 않음
        row.style.visibility = "hidden";

        // 원본 SVG의 벡터 글자 9개 사용
        const start = sourceRow * 9;

        const rowPaths = paths.slice(
          start,
          start + 9
        );

        const line = document.createElementNS(NS, "g");
        line.setAttribute("class", "try-harder-line");
        rowPaths.forEach(path => {
          line.appendChild(path.cloneNode(true));
        });
        row.appendChild(line);

        // 11번 이후에도 동일한 글씨를
        // 아래쪽으로 계속 연결
        if (i >= 6) {

          const extraY =
            (i - 5) * ROW_STEP;

          row.setAttribute(
            "transform",
            `translate(0, ${extraY})`
          );

        }

        track.appendChild(row);
        rows.push(row);

      }

      document.getElementById(
        "sequence"
      ).appendChild(svg);


      // ==========================================
      // 4. 처음 위치
      // ==========================================

      let currentY = ROW_STEP * 2;

      track.setAttribute(
        "transform",
        `translate(0, ${currentY})`
      );

      function showRow(index) {
        // Grow all lines together while keeping enough space between rows.
        const scale = 1 + 0.65 * (1 - 0.83 ** index);
        track.style.setProperty("--row-scale", scale);
        rows[index].style.visibility = "visible";
        if (index < 4) window.projectSounds?.play("tryHarderRow");
      }

      await Promise.all([introArtReady, introRevealDelay]);
      introArt.hidden = false;
      window.projectSounds?.play("tryHarderImpact");
      await waitForIntroSwipe();

      await blinkTo(() => {
        document.getElementById("intro-screen").remove();
        showRow(0);
      });


      // ==========================================
      // 6. 전체 글씨가 부드럽게 이동
      // ==========================================

      function moveTo(targetY, duration) {

        const startY = currentY;
        const startTime = performance.now();

        function animate(now) {

          const t = Math.min(
            (now - startTime) / duration,
            1
          );

          // 부드러운 감속
          const ease = t * (2 - t);

          currentY =
            startY +
            (targetY - startY) * ease;

          track.setAttribute(
            "transform",
            `translate(0, ${currentY})`
          );

          if (t < 1) {
            requestAnimationFrame(animate);
          }

        }

        requestAnimationFrame(animate);

      }


      // ==========================================
      // 7. 처음에는 천천히 등장
      // ==========================================

      // 25-05 → 25-06 : 1초
      await wait(1000);

      showRow(1);

      // 새 줄을 보여주면서 기존 줄을
      // 부드럽게 위로 밀어 올리기
      moveTo(ROW_STEP, 240);


      // 25-06 → 25-07 : 0.5초
      await wait(500);

      showRow(2);


      // 25-07 → 25-08 : 0.3초
      // 두 SVG의 글자 배열이 같아서
      // 여기서는 잠시 유지
      await wait(300);


      // ==========================================
      // 8. 이후 빠르게 쏟아짐
      // ==========================================

      // 25-08 → 25-09 : 0.1초
      await wait(100);

      showRow(3);


      // 25-09 → 25-10 : 0.1초
      await wait(100);

      showRow(4);

      // 화면이 차면 위로 부드럽게 이동
      moveTo(0, MOVE_DURATION);


      // 25-10 → 25-11 : 0.1초
      await wait(100);

      showRow(5);


      // ==========================================
      // 9. 마지막 6줄이 주르륵 이어짐
      // ==========================================

      
for (
  let i = 6;
  i < totalRows;
  i++
) {

  // 기존 0.1초 반복
  await wait(FAST_INTERVAL);

  // TRY HARDER 등장
  showRow(i);

  // 기존 글씨 위로 밀어 올리기
  const targetY =
    -ROW_STEP * (i - 5);

  moveTo(
    targetY,
    MOVE_DURATION
  );

  // 전체 9번째 TRY HARDER가 등장한 직후
  
if (i === 13) {

  // 기존 글리치 영상 + 컴퓨터 종료 효과
  await wait(MOVE_DURATION);
  await playGlitchVideo();

  if (window.parent !== window) {
    window.parent.postMessage({ type: "NEXT_PAGE" }, "*");
  } else {
    drawSequenceEye(0);
    sequenceBlink.style.visibility = "visible";
    await tweenSequenceEye(0, 1, BLINK_CLOSE_MS);
    await wait(BLINK_HOLD_MS + 1000);
    window.location.href = "11_stack.html?blink=sequence";
  }

  return;
}

}


      // 마지막 이동까지 완료
      await wait(MOVE_DURATION);

      // 화면을 그대로 유지

    }


    // ==========================================
    // 10. 자동 실행
    // ==========================================

    startSequence().catch(error => {
      console.error(error);
    });

  </script>
