
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>06. TIME LIMIT</title>

  <link rel="stylesheet"
        href="../flip-clock-assets/flip-clock.css">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #090909;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #opflip-time-limit {
      width: 100%;
    }

/* 상단 문구 전체 제거 */
.topline,
.opflip-topline {
  display: none !important;
}

/* 하단 시간 표시 및 버튼 제거 */
.controls,
.opflip-controls {
  display: none !important;
}


/* 06 페이지 화면 정리 */

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

.wrapper {
  width: min(100vw, 177.7778vh);
  padding: 0;
  margin: 0;
}

.topline,
.controls {
  display: none !important;
}

#viewport {
  border: none;
}

  </style>
<script src="../assets/project-sounds.js"></script>
<script src="../assets/project-scroll-hint.js"></script>
</head>

<body>

  <section id="opflip-time-limit">


    <div class="opflip-viewport">
      <div class="opflip-stage">

        <!-- 시계 본체 -->
        <img
          class="opflip-bg"
          src="../flip-clock-assets/12-09.svg"
          alt=""
        >

        <!-- 분할선과 하이라이트 -->
        <img
          class="opflip-line"
          src="../flip-clock-assets/12-12.svg"
          alt=""
        >

      </div>
    </div>

    <div class="opflip-controls">

      <span class="opflip-label">02:00</span>

      <button type="button"
              class="opflip-btn opflip-play">
        ▶ PLAY
      </button>

      <button type="button"
              class="opflip-btn opflip-reset">
        ↺ RESET
      </button>

    </div>

  </section>

  
<!-- 시계 원래 기능 -->
<script src="../flip-clock-assets/flip-clock.js"></script>

<!-- 00:00 이후 스크롤 → 다음 페이지 -->
<script>
(() => {

  const label = document.querySelector(".opflip-label");

  let finishedAt = null;
  let nextStarted = false;

  // 시계가 00:00인지 확인
  function checkFinished() {

    if (!label) return;

    const time = label.textContent.replace(/\s/g, "");

    if (time === "00:00" && finishedAt === null) {
      finishedAt = performance.now();
    }

  }

  // 시간 표시가 바뀔 때 감지
  if (label) {

    new MutationObserver(checkFinished).observe(label, {
      childList: true,
      characterData: true,
      subtree: true
    });

    checkFinished();

  }

  // 아래로 스크롤하면 다음 페이지 요청
  window.addEventListener("wheel", (e) => {

    if (e.deltaY <= 0) return;
    if (nextStarted) return;

    checkFinished();

    // 00:00이 되기 전에는 이동 불가
    if (finishedAt === null) return;

    // 00:00이 된 직후 0.8초 동안 대기
    if (performance.now() - finishedAt < 800) return;

    nextStarted = true;

    // index.html의 기존 눈 깜박임을 통해 이동
    window.parent.postMessage(
      { type: "NEXT_PAGE" },
      window.location.origin
    );

  }, { passive: true });


window.installProjectScrollHint(() => !nextStarted && finishedAt !== null && performance.now() - finishedAt >= 800);
})();
</script>

  </script>

</body>
</html>
